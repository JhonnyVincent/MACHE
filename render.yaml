# Déploiement du backend commerce MACHÉ sur Render.
#
# Ce fichier ne concerne que backend/ (Medusa + Mercur), un serveur Node
# persistant. Le site Next.js est déployé à côté, comme un second
# service Render, créé à la main — il n'est pas décrit ici.
#
# Les deux services n'ont PAS les mêmes variables, et une variable posée
# sur le mauvais service est ignorée sans aucun message. Le partage est
# dans DEPLOIEMENT.md, section « Deux services, deux jeux de variables ».
#
# ---------------------------------------------------------------------
# LIRE AVANT DE DÉPLOYER — ce que le plan gratuit implique réellement
# ---------------------------------------------------------------------
#
# 1. La base PostgreSQL gratuite de Render EXPIRE au bout de 30 jours et
#    est supprimée. Tout ce qui s'y trouve disparaît : produits, vendeurs,
#    commandes. C'est acceptable pour une démonstration, jamais pour de
#    vraies ventes. Passer en base payante avant la première commande
#    réelle.
#
# 2. Le service web gratuit s'endort après ~15 minutes sans trafic. Le
#    réveil prend environ une minute : la première visite après une
#    période calme paraîtra cassée. Pour une démonstration à quelqu'un,
#    ouvrir le site une minute avant.
#
# 3. Redis n'est pas prévu ici. Medusa bascule alors sur une file
#    d'événements en mémoire et le dit dans ses logs :
#    « Local Event Bus installed. This is not recommended for production. »
#    Conséquence concrète : un événement en cours au moment d'un
#    redémarrage est perdu — un e-mail de confirmation, une mise à jour de
#    stock. Tolérable en démonstration, pas en production.
#
# Autrement dit : ce fichier sert à VOIR la plateforme en ligne et à la
# montrer. Le passage aux plans payants est une étape distincte, à faire
# avant d'accepter le moindre paiement réel.

services:
  - type: web
    name: mache-backend
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    # `bun run build` à la racine, et non `medusa build` seul.
    #
    # `medusa build` ne compile que le serveur. Il ne construit pas les
    # deux panneaux (apps/admin et apps/vendor) et ne lance pas
    # bundle-dashboards.mjs, qui les recopie dans l'artefact. Résultat :
    # le backend répondait « Dashboard not built » sur /seller et
    # /dashboard — et sans panneau, un vendeur ne peut ni ajouter un
    # produit, ni voir une commande.
    #
    # Turborepo enchaîne les trois dans l'ordre : les panneaux d'abord,
    # puis packages/api, dont le script `build` chaîne `medusa build`
    # et l'empaquetage.
    buildCommand: npm install -g bun && bun install && bun run build
    # Trois temps, dans cet ordre :
    #   1. migrations — la base rattrape le code ;
    #   2. amorçage   — catalogue de démonstration si SEED_DEMO le
    #      demande et si le catalogue est vide, puis mise en place
    #      MACHÉ : région Haïti, canal de vente, clé publique du site.
    #      Idempotent : au deuxième démarrage il constate ce qui existe
    #      et ne recrée rien. Environ quatre secondes, et il affiche
    #      dans les journaux les trois valeurs à reporter côté site ;
    #   3. le serveur.
    startCommand: >-
      cd packages/api &&
      ./node_modules/.bin/medusa db:migrate &&
      ./node_modules/.bin/medusa exec ./src/scripts/bootstrap.ts &&
      ./node_modules/.bin/medusa start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: mache-db
          property: connectionString
      # Générés une fois par Render, puis conservés. Ne jamais les
      # remettre à une valeur connue : ils signent les sessions.
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      # Partagé avec le site : il autorise le backend à vider le cache du
      # site quand un prix ou un produit change. À recopier tel quel dans
      # la variable STOREFRONT_REVALIDATE_SECRET de l'hébergeur du site.
      # Sans lui, le site reste juste, avec jusqu'à une minute de retard.
      - key: STOREFRONT_REVALIDATE_SECRET
        generateValue: true
      # LA SEULE VALEUR À SAISIR : l'adresse publique du site, sans "/"
      # final. Par exemple https://mache.vercel.app
      #
      # Les origines autorisées (STORE_CORS, ADMIN_CORS, VENDOR_CORS,
      # AUTH_CORS) et l'adresse des images s'en déduisent, avec
      # RENDER_EXTERNAL_URL que Render fournit tout seul. Elles se
      # saisissaient une par une : quatre occasions de se tromper, pour
      # une erreur qui ne se voit qu'au premier appel refusé par le
      # navigateur. Elles restent déclarables à la main si un domaine
      # propre ou une préproduction s'ajoute.
      - key: STOREFRONT_URL
        sync: false
      # MERCUR_BACKEND_URL n'est plus demandée.
      #
      # Les deux panneaux la gravaient à la construction ; oubliée ou
      # mal saisie, ils visaient http://localhost:9000 et chaque
      # connexion vendeur finissait en « Failed to fetch ». Ils
      # appellent désormais l'adresse de la page qui les affiche —
      # juste par construction, puisque ce backend les sert lui-même.
      # Voir backend/apps/same-origin-backend.ts.
      # Catalogue de démonstration Mercur, pour voir la plateforme
      # vivante avant d'avoir des vendeurs. Mettre "true" une fois, puis
      # RETIRER la variable.
      #
      # Elle ne charge rien si le catalogue contient déjà un produit :
      # la démonstration ne s'ajoute jamais à un catalogue existant.
      #
      # Ce sont des chaussures fictives en euros. À retirer avant
      # d'ouvrir la boutique à de vrais clients : un catalogue inventé
      # qui reste en ligne fait passer pour des offres ce qui n'en est
      # pas.
      - key: SEED_DEMO
        sync: false
      # L'envoi des e-mails — pour l'instant, le lien « mot de passe
      # oublié » (client, vendeur, administration).
      #
      # Par Brevo, et non par le SMTP de Gmail : le plan gratuit de
      # Render BLOQUE les ports SMTP sortants (25, 465, 587). Un envoi
      # par Gmail y partirait dans le vide, sans le moindre message
      # d'erreur. Brevo passe par HTTPS ; son offre gratuite couvre 300
      # e-mails par jour.
      #
      # À saisir : la clé d'API Brevo (compte Brevo > SMTP & API > Clés
      # API). C'est un secret : jamais dans le code, jamais ailleurs
      # qu'ici. Sans elle, aucun e-mail ne part, et les journaux le
      # disent.
      - key: BREVO_API_KEY
        sync: false
      # L'adresse d'expédition. Brevo exige de la confirmer une fois
      # (Expéditeurs > Ajouter un expéditeur), en cliquant sur le lien
      # qu'il y envoie.
      #
      # Une adresse @gmail.com envoyée par un autre service que Gmail
      # tombe plus souvent dans les indésirables. Acceptable pour
      # démarrer ; la solution durable est une adresse sur un nom de
      # domaine à MACHÉ, authentifié chez Brevo.
      #
      # Saisie dans Render, pas écrite ici : elle doit être EXACTEMENT
      # l'adresse confirmée chez Brevo, et c'est MACHÉ qui la choisit.
      - key: MAIL_FROM
        sync: false
      # Le nom affiché à côté de l'adresse d'expédition.
      - key: MAIL_FROM_NAME
        value: MACHÉ
      # L'abonnement aux nouvelles de MACHÉ (bandeau « Restez au
      # courant » de l'accueil). Les adresses vont dans une liste de
      # contacts Brevo ; les lettres se composent et s'envoient depuis
      # Brevo, qui gère le désabonnement.
      #
      # L'identifiant de la liste : Brevo > Contacts > Listes. Sans lui,
      # le site répond franchement que l'abonnement n'est pas ouvert.
      - key: BREVO_NEWSLETTER_LIST_ID
        sync: false
      # Facultatif, recommandé : un modèle Brevo de double confirmation
      # (« confirmez votre inscription »). Empêche d'inscrire l'adresse
      # de quelqu'un d'autre ; attendu par les règles européennes pour
      # les abonnés de la diaspora.
      - key: BREVO_DOI_TEMPLATE_ID
        sync: false
      # Le compte d'administration MACHÉ, créé au premier démarrage.
      #
      # Le plan gratuit de Render n'offre pas d'onglet Shell : sans
      # ces deux variables, il n'y aurait aucun moyen d'ouvrir
      # l'administration de sa propre marketplace.
      #
      # À RETIRER une fois le compte créé. Le compte reste ; le mot de
      # passe n'a pas à rester lisible par quiconque ouvre ce tableau
      # de bord.
      #
      # Les laisser en place ne casse rien : le mot de passe d'un
      # compte existant n'est jamais réécrit.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Facteur d'affichage des prix de démonstration en gourdes.
      #
      # Ce n'est PAS un taux de change. Le catalogue de démonstration est
      # chiffré en euros ; sans prix en gourdes, tout s'affiche « Prix
      # indisponible » et rien n'entre dans un panier. Les montants en
      # euros sont donc multipliés par ce facteur pour donner des ordres
      # de grandeur plausibles à une boutique fictive. Par défaut : 140.
      - key: DEMO_HTG_FACTOR
        sync: false
      # Tarif de livraison de démonstration, en gourdes. Les zones de
      # livraison du catalogue Mercur ne couvrent que l'Europe : sans
      # cela, un panier ne peut pas aller jusqu'à la commande. Ce n'est
      # pas un coût de transport étudié. Par défaut : 350.
      - key: DEMO_SHIPPING_HTG
        sync: false

databases:
  - name: mache-db
    plan: free
    region: frankfurt
    databaseName: mache_commerce
