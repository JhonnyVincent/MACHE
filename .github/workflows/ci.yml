# Vérifications avant déploiement.
#
# Pourquoi ce fichier existe
#
# Render était réglé sur « After CI Checks Pass » : il attend que les
# vérifications d'intégration continue réussissent avant de déployer.
# Le dépôt n'en avait aucune. Render attendait donc des vérifications
# qui ne venaient jamais, et le site est resté treize commits en
# arrière — sans qu'aucune erreur ne soit signalée nulle part, puisque
# de son point de vue il attendait patiemment.
#
# Ce que ce workflow vérifie
#
# Que le site se construit, et que la suite de tests passe. C'est
# exactement ce qui doit barrer la route à un déploiement : une
# construction cassée mise en ligne remplace un site qui marche par une
# page d'erreur.
#
# Le backend est vérifié par son typage, pas par sa construction
#
# La construction du panneau vendeur Mercur ne se comporte pas pareil
# selon l'installateur : `@mercurjs/vendor` importe `i18next` sans le
# déclarer, ce qui échoue avec une installation isolée et passe avec une
# installation à plat. Bloquer les déploiements là-dessus reviendrait à
# recréer le problème qu'on répare ici.
#
# Le typage, lui, est fiable et suffit à attraper ce qui compte. Une
# erreur de type est partie en production une fois — une conversion
# refusée dans une route d'analytics — parce que rien ne relisait
# `backend/` avant Render. `tsc -b` sur les deux panneaux couvre aussi
# `packages/api`, qu'ils référencent : c'est exactement la vérification
# qui manquait.

name: Vérifications

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  site:
    name: Site (construction et tests)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # `npm ci` installe exactement ce que décrit package-lock.json.
      # `npm install` pourrait résoudre autrement que la production.
      - name: Installer les dépendances
        run: npm ci

      # La construction n'a pas besoin du backend commerce : sans lui, le
      # site se construit en mode dégradé, ce qui est précisément le
      # comportement qu'on veut garantir.
      - name: Construire le site
        run: npm run build

      # Les tests lisent aussi du code de `backend/` — la règle qui
      # décide combien MACHÉ verse sur une promotion, l'algorithme des
      # codes à usage unique. Certains de ces fichiers importent des
      # paquets du backend, absents de l'installation du site.
      #
      # L'installation vient APRÈS la construction, volontairement : le
      # site doit continuer de se construire sans rien du backend, et
      # avancer cette étape masquerait une régression sur ce point.
      - uses: oven-sh/setup-bun@v2

      - name: Installer les dépendances du backend
        working-directory: backend
        run: bun install --frozen-lockfile

      - name: Lancer les tests
        run: npm test

  backend:
    name: Backend (typage)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Le backend est installé avec bun, et son verrou est un bun.lock.
      - uses: oven-sh/setup-bun@v2

      - name: Installer les dépendances du backend
        working-directory: backend
        run: bun install --frozen-lockfile

      # Les types de routes sont générés, et volontairement absents du
      # dépôt (`.mercur/` est ignoré). Sans cette étape, les panneaux ne
      # résolvent pas `@acme/api/_generated` et le typage échoue pour
      # une raison qui n'a rien à voir avec le code.
      - name: Générer les types de routes
        working-directory: backend/packages/api
        run: ./node_modules/.bin/mercurjs codegen

      # `tsc -b` suit les références de projet : vérifier les panneaux
      # vérifie aussi packages/api, où vivent les routes.
      - name: Vérifier le typage du panneau vendeur
        working-directory: backend/apps/vendor
        run: ../../node_modules/.bin/tsc -b

      - name: Vérifier le typage du panneau d'administration
        working-directory: backend/apps/admin
        run: ../../node_modules/.bin/tsc -b
