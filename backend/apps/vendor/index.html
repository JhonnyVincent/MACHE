<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/public/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MACHE — Espace vendeur</title>
    <!--
      Le panneau démarre en français. La langue est lue dans le cookie ou
      le stockage « lng » (i18next) ; sans rien, il retombait sur l'anglais,
      quel que soit le navigateur. On passe en « fr » UNE fois (même si le navigateur
      avait retenu l'anglais par défaut) ; ensuite un changement fait
      dans Profil → Langue reste respecté.
    -->
    <script>
      try {
        var done = window.localStorage.getItem("mache.lng.fr");
        if (!done) {
          window.localStorage.setItem("mache.lng.fr", "1");
          window.localStorage.setItem("lng", "fr");
          document.cookie = "lng=; Max-Age=0; path=/";
        } else if (!/(^|;\s*)lng=/.test(document.cookie) && !window.localStorage.getItem("lng")) {
          window.localStorage.setItem("lng", "fr");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
